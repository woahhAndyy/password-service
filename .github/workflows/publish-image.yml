
name: Build and Push Password Service

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os

          username = os.environ.get("DOCKERHUB_USERNAME", "")
          token = os.environ.get("DOCKERHUB_TOKEN", "")

          print("Username exists:", bool(username))
          print("Username is correct:", username == "woahhAndyy")
          print("Token exists:", bool(token))
          print("Token has expected prefix:", token.startswith("dckr_pat_"))
          print("Token has surrounding spaces:", token != token.strip())
          print("Token contains whitespace:", any(c.isspace() for c in token))
          print("Token length:", len(token))
          PY
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/password-service:v1
