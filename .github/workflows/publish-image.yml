
name: Build and Push Password Service

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub credentials exist
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" || { echo "Username variable is missing"; exit 1; }
          test -n "$TOKEN" || { echo "Docker Hub token is missing"; exit 1; }
          echo "Both credentials are available."
      - name: Test Docker Hub credentials directly
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -u "$USERNAME:$TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:woahhandyy/password-service:pull,push")
          echo "Docker Hub authentication test returned HTTP $STATUS"
          test "$STATUS" = "200"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: woahhAndyy/password-service:v1
