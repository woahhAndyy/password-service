
name: Build and Push Password Service

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub credentials exist
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" || { echo "Username variable is missing"; exit 1; }
          test -n "$TOKEN" || { echo "Docker Hub token is missing"; exit 1; }
          echo "Both credentials are available."
      - name: Test Docker Hub authentication
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          RESPONSE=$(mktemp)
          STATUS=$(curl -sS -o "$RESPONSE" -w "%{http_code}" \
            -u "$DH_USERNAME:$DH_TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io")

          echo "Docker Hub authentication returned HTTP $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "Docker Hub accepted the saved credentials."
          else
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("detail") or d.get("message") or d.get("error") or "No error details returned.")' "$RESPONSE"
            exit 1
          fi

          rm -f "$RESPONSE"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: woahhAndyy/password-service:v1
